    <rect x="10" y="18" width="60" height="12" fill="#fff" opacity="0.85"/>
    <text x="40" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#fff">WHEY</text>
    <text x="40" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#fff">ISOLATE</text>
  </g>
  <g transform="translate(410,330)">
    <ellipse cx="35" cy="110" rx="35" ry="8" fill="#000" opacity="0.5"/>
    <rect x="0" y="0" width="70" height="110" rx="6" fill="#222"/>
