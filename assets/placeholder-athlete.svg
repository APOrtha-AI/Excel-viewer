<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="60%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- streaks -->
  <g stroke="#ff6a13" stroke-linecap="round" opacity="0.5">
    <line x1="-50" y1="120" x2="900" y2="-100" stroke-width="2"/>
    <line x1="-50" y1="220" x2="900" y2="0" stroke-width="3"/>
    <line x1="-50" y1="340" x2="900" y2="120" stroke-width="2"/>
    <line x1="-50" y1="460" x2="900" y2="240" stroke-width="3"/>
    <line x1="-50" y1="560" x2="900" y2="340" stroke-width="2"/>
  </g>
  <!-- athlete silhouette -->
  <g transform="translate(400,90)" fill="url(#bodyGrad)">
    <!-- head -->
    <ellipse cx="0" cy="50" rx="55" ry="65"/>
    <!-- neck -->
    <rect x="-22" y="105" width="44" height="40"/>
    <!-- torso -->
    <path d="M-130 145 L130 145 L160 320 L120 380 L-120 380 L-160 320 Z"/>
    <!-- arms -->
    <path d="M-130 150 L-200 290 L-180 320 L-110 200 Z"/>
    <path d="M130 150 L210 280 L195 320 L120 210 Z"/>
  </g>
  <!-- products in front -->
  <g transform="translate(330,400)">
    <rect x="0" y="0" width="130" height="170" rx="8" fill="#161616" stroke="#2a2a2a"/>
    <rect x="14" y="18" width="100" height="16" fill="#fff" opacity="0.85"/>
    <text x="64" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">AMINO</text>
    <text x="64" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#fff">PATTERN</text>
    <path d="M40 138 L90 138 L75 156 L55 156 Z" fill="#ff6a13"/>
  </g>
  <g transform="translate(470,440)">
    <rect x="0" y="0" width="90" height="130" rx="6" fill="#181818" stroke="#2a2a2a"/>
    <rect x="10" y="14" width="70" height="10" fill="#fff" opacity="0.85"/>
    <text x="45" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#fff">WHEY</text>
    <text x="45" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#fff">ISOLATE</text>
  </g>
  <g transform="translate(580,470)">
    <rect x="0" y="0" width="60" height="100" rx="6" fill="#1c1c1c" stroke="#2a2a2a"/>
    <rect x="0" y="0" width="60" height="18" rx="6" fill="#0e0e0e"/>
  </g>
</svg>
